<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#141c33" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    /* Dynamic Wave Animations */
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-60px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1200px); }
    }
    .wave1 {
      animation: waveMove1 12s ease-in-out infinite;
    }
    .wave2 {
      animation: waveMove2 16s ease-in-out infinite;
    }
    .pulsing-beam {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .pill-dynamic {
      animation: floatPill 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Background Glowing Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="950" cy="80" r="90" fill="#c084fc" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic Wave Element 1 (Live Streaming Data Waves at bottom) -->
  <g class="wave1" opacity="0.25">
    <path d="M-100,320 C150,270 300,340 550,290 C800,240 950,330 1300,280 L1300,360 L-100,360 Z" fill="url(#primaryGrad)" />
  </g>

  <!-- Dynamic Wave Element 2 (Cross stream) -->
  <g class="wave2" opacity="0.18">
    <path d="M-100,330 C200,350 450,260 700,310 C950,360 1100,270 1350,320 L1350,360 L-100,360 Z" fill="#38bdf8" />
  </g>

  <!-- Top Accent Glowing Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryGrad)" />

  <!-- Video Stream Signal / Equalizer Visual on right (Strictly background decoration) -->
  <g opacity="0.3" transform="translate(930, 110)">
    <!-- Stream Signal Waves -->
    <rect x="0" y="30" width="6" height="50" rx="3" fill="#38bdf8" />
    <rect x="16" y="15" width="6" height="80" rx="3" fill="#818cf8" />
    <rect x="32" y="45" width="6" height="20" rx="3" fill="#c084fc" />
    <rect x="48" y="5" width="6" height="100" rx="3" fill="#38bdf8" />
    <rect x="64" y="25" width="6" height="60" rx="3" fill="#818cf8" />
    <rect x="80" y="40" width="6" height="30" rx="3" fill="#c084fc" />
    <rect x="96" y="20" width="6" height="70" rx="3" fill="#38bdf8" />
    <rect x="112" y="10" width="6" height="90" rx="3" fill="#818cf8" />
    <rect x="128" y="35" width="6" height="40" rx="3" fill="#c084fc" />
    <rect x="144" y="25" width="6" height="60" rx="3" fill="#38bdf8" />
    <rect x="160" y="50" width="6" height="10" rx="3" fill="#818cf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g class="pill-dynamic" transform="translate(60, 48)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="16" r="4.5" fill="#38bdf8" class="pulsing-beam" />
    <text x="30" y="21" class="badge-text" fill="#38bdf8">ENTERPRISE VIDEO ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <text x="60" y="142" class="title" fill="url(#primaryGrad)" filter="url(#softGlow)">
    Awesome Business Streaming Video
  </text>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <text x="60" y="186" class="subtitle">
    Curated Hub of SaaS Platforms, Live Ingest Engines &amp; Open-Source Infrastructure
  </text>

  <!-- FOREGROUND CONTENT: Key Capability Pills -->
  <g transform="translate(60, 222)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="90" y="24" text-anchor="middle" class="badge-text">🎥 Live &amp; VOD Streaming</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="170" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="85" y="24" text-anchor="middle" class="badge-text">⚡ WebRTC &amp; HLS / SRT</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="190" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="95" y="24" text-anchor="middle" class="badge-text">🏢 Enterprise Video CMS</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(585, 0)">
      <rect width="210" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="105" y="24" text-anchor="middle" class="badge-text">🔓 Self-Hosted / Sovereign</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" stroke="#334155" stroke-width="1" fill="none" />
</svg>
